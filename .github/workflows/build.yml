name: "Manual Build"

on:
  workflow_dispatch:

jobs:
  build-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest" # Apple Silicon
            args: "--target aarch64-apple-darwin"
            rust_target: "aarch64-apple-darwin"
            bundle_path: "src-tauri/target/aarch64-apple-darwin/release/bundle/"
            artifact_name: "skills-manager-macos-aarch64"
          - platform: "macos-15-intel" # Intel Mac (Native x64 runner)
            args: "--target x86_64-apple-darwin"
            rust_target: "x86_64-apple-darwin"
            bundle_path: "src-tauri/target/x86_64-apple-darwin/release/bundle/"
            artifact_name: "skills-manager-macos-x64"
          - platform: "ubuntu-22.04"
            args: ""
            rust_target: ""
            bundle_path: "src-tauri/target/release/bundle/"
            artifact_name: "skills-manager-ubuntu-22.04"
          - platform: "windows-latest"
            args: ""
            rust_target: ""
            bundle_path: "src-tauri/target/release/bundle/"
            artifact_name: "skills-manager-windows-latest"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: install create-dmg
        if: startsWith(matrix.platform, 'macos-')
        run: brew install create-dmg

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri"

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: install frontend dependencies
        run: npm ci

      - name: build tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__ # the action automatically replaces \_\_VERSION\_\_ with the app version.
          releaseName: "Skills Manager v__VERSION__"
          releaseBody: "See the assets to download this version and install."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Rename .app with architecture
        if: startsWith(matrix.platform, 'macos-')
        run: |
          cd "${{ matrix.bundle_path }}macos"
          if [[ "${{ matrix.rust_target }}" == *"aarch64"* ]]; then
            mv "Skills Manager.app" "Skills Manager_aarch64.app"
          else
            mv "Skills Manager.app" "Skills Manager_x64.app"
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.bundle_path }}
          retention-days: 7
